# Bright Riders School — SmartCanteen Netlify Configuration
# Deploys the Vite React SPA to Netlify's global CDN and the Express + SQLite API as a
# self-contained Node 22 Netlify Function backed by strong-consistency Netlify Blobs storage.

[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "dist/functions"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--no-warnings"
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"

# Route API requests to the Express Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Route dynamic uploaded food images to the Express Netlify Function
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA fallback for React client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
