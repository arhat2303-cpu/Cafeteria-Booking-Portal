# Bright Riders School — Digital Canteen Netlify Configuration
# Deploys the Vite React SPA to Netlify's global CDN and the Express + WASM SQLite API
# as a zero-native-dependency Netlify Function compatible with Node 18, 20, and 22.

[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "dist/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"

# Route API requests (preserving path splat) to the Express Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Route dynamic uploaded food images to the Express Netlify Function
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true

# SPA fallback for React client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
